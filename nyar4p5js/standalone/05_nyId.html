  /** Devuelve un elemento dibujable (video, img, canvas) a partir de objetos p5 o DOM. */

    if (src.elt) return src.elt;          // p5.MediaElement (createCapture / createVideo)
    if (src.canvas) return src.canvas;    // p5.Image / p5.Graphics / p5.Renderer
    return src;                           // HTMLVideoElement / HTMLCanvasElement / HTMLImageElement / ImageBitmap
  }

  function sourceSize(el) {
    return [el.videoWidth || el.naturalWidth || el.width || 0,
            el.videoHeight || el.naturalHeight || el.height || 0];

  function isImageLike(src) {

    c.width = w; c.height = h;
    return c;

  // (el <canvas> lleva .canvas apuntando a sí mismo para usarse igual que un p5.Graphics)

    if (P && typeof P.createGraphics === 'function') {

      g.pixelDensity(1);

    var c = makeCanvas(w, h);
    c.canvas = c;
    return { g: c, ctx: c.getContext('2d') };

      img.crossOrigin = 'anonymous';
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error('nyar4p5: no se pudo cargar la imagen ' + url)); };

  var IMAGE_URL = /^data:image\/|\.(png|jpe?g|gif|webp|bmp|svg)(\?.*)?$/i;

  // ---------- carga de datos ----------

  async function toBytes(src) {
    if (src instanceof Uint8Array) return src;
    if (src instanceof ArrayBuffer) return new Uint8Array(src);
    if (typeof src === 'string') {
      var res = await fetch(src);
      if (!res.ok) throw new Error('nyar4p5: no se pudo cargar ' + src + ' (' + res.status + ')');
      return new Uint8Array(await res.arrayBuffer());

    throw new Error('nyar4p5: parámetro de cámara no válido (usa una URL o bytes de camera_para.dat)');

  // camera_para.dat: big-endian; int xsize, int ysize, double mat[3][4], distorsión...
  function parseCameraPara(bytes) {
    var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var xsize = dv.getInt32(0, false), ysize = dv.getInt32(4, false);
    var mat = [];
    for (var i = 0; i < 12; i++) mat.push(dv.getFloat64(8 + i * 8, false));
    if (!(xsize > 0 && xsize < 10000 && ysize > 0 && ysize < 10000)) {
      throw new Error('nyar4p5: camera_para.dat ilegible');
    }
    return { xsize: xsize, ysize: ysize, mat: mat };
  }

  // camera_para.dat girado: intercambia los ejes X e Y (cámara vertical <-> horizontal)
  function transposeCameraPara(bytes) {
    var out = new Uint8Array(bytes), dv = new DataView(out.buffer, out.byteOffset, out.byteLength);
    var src = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var g = function (i) { return src.getFloat64(8 + i * 8, false); };
    var s = function (i, v) { dv.setFloat64(8 + i * 8, v, false); };
    dv.setInt32(0, src.getInt32(4, false), false);
    dv.setInt32(4, src.getInt32(0, false), false);
    // mat 3×4: [fx s cx 0; 0 fy cy 0; 0 0 1 0] -> fx<->fy, cx<->cy
    s(0, g(5)); s(5, g(0)); s(2, g(6)); s(6, g(2)); s(1, 0); s(4, 0);
    // distorsión (versión 4): k1 k2 p1 p2 fx fy x0 y0 s
    var nd = (bytes.byteLength - 104) / 8;
    if (nd === 9) { s(14, g(15)); s(15, g(14)); s(16, g(17)); s(17, g(16)); s(18, g(19)); s(19, g(18)); }
    else if (nd >= 4) { s(12, g(13)); s(13, g(12)); }
    return out;
  }

  // ======================================================================
  //  Celular y escritorio: cámara y lienzo
  // ======================================================================

  /** true en celulares y tablets (pantalla táctil como entrada principal). */
  function isMobile() {
    var nav = root.navigator || {};
    var ua = nav.userAgent || '';
    if (/Android|iPhone|iPad|iPod|Mobile/i.test(ua)) return true;
    return nav.maxTouchPoints > 1 && /Macintosh/.test(ua); // iPad que se presenta como Mac
  }

  /** Tamaño de proceso recomendado: 480×640 en un celular en vertical, 640×480 en el resto. */
  function arSize() {
    var portrait = isMobile() && root.innerHeight > root.innerWidth;
    return portrait ? [480, 640] : [640, 480];
  }

  function p5Instance(p) { return (p && typeof p.createCanvas === 'function') ? p : root; }

  /**
   * Crea el lienzo WEBGL del tamaño correcto (vertical en el celular) y lo ajusta a la pantalla
   * sin deformarlo. Después usa width y height para el MultiMarker.
   *   opts.maxScale: límite de ampliación (por defecto sin límite; 1 = nunca más grande que el proceso)
   *   opts.parent:   id o elemento donde colocar el lienzo (sin él, el lienzo se centra en la pantalla)
   *   opts.fit:      'contain' (por defecto: se ve entero) | 'cover' (llena la pantalla recortando los bordes)
   */
  function createARCanvas(p, opts) {
    opts = opts || {};
    var doc = root.document;
    if (!doc.querySelector('meta[name="viewport"]')) {
      // el index.html del p5.js Web Editor no la trae: sin ella el celular muestra la página "de escritorio", diminuta
      var meta = doc.createElement('meta');
      meta.name = 'viewport'; meta.content = 'width=device-width, initial-scale=1';
      doc.head.appendChild(meta);
    }
    var P = p5Instance(p), sz = arSize();
    var w = opts.width || sz[0], h = opts.height || sz[1];
    var cnv = P.createCanvas(w, h, P.WEBGL);
    if (typeof opts.parent === 'string' && !root.document.getElementById(opts.parent.replace(/^#/, ''))) {
      warn('no existe el elemento "' + opts.parent + '" en index.html: el lienzo se centra en la pantalla');
      opts = Object.assign({}, opts, { parent: null });
    }
    if (opts.parent) cnv.parent(opts.parent);
    // .parent('x') encadenado con un elemento que no existe (p. ej. un sketch viejo con el index.html del
    // editor): avisar y dejar el lienzo centrado en vez de romper el sketch
    var parentOrig = cnv.parent;
    var safeParent = function (target) {
      if (target === undefined) return parentOrig.call(cnv);
      if (typeof target === 'string' && !root.document.getElementById(target.replace(/^#/, ''))) {
        warn('no existe el elemento "' + target + '" en index.html: el lienzo se queda centrado en la pantalla');
        return api;
      }
      var r = parentOrig.call(cnv, target);
      var e = cnv.elt || cnv.canvas; if (e) { e.style.position = ''; e.style.left = ''; e.style.top = ''; e.style.transform = ''; }
      return r;
    };
    // (en p5 2.x .parent no se puede reemplazar en el lienzo: se devuelve un Proxy que lo intercepta)
    var api = (typeof Proxy === 'function') ? new Proxy(cnv, {
      get: function (t, k) {

        var v = Reflect.get(t, k, t);
        return typeof v === 'function' ? v.bind(t) : v;
      }

    P.pixelDensity(Math.min(2, P.displayDensity ? P.displayDensity() : 1));
    var el = cnv.elt || cnv.canvas || P.canvas || P.drawingContext.canvas;
    el.style.touchAction = 'none'; // tocar no hace zoom ni desplaza la página
    if (!opts.parent) {
      // sin contenedor: el lienzo se centra en la pantalla (sirve con el index.html del p5.js Web Editor)
      el.style.position = 'fixed'; el.style.left = '50%'; el.style.top = '50%';
      el.style.transform = 'translate(-50%, -50%)';
      root.document.body.style.overflow = 'hidden';
    }
    var maxScale = opts.maxScale || Infinity;
    function fit() {
      var de = root.document.documentElement; // (innerWidth crece si el lienzo es más ancho que la pantalla)
      var kx = (de.clientWidth || root.innerWidth) / w, ky = (de.clientHeight || root.innerHeight) / h;
      var k = Math.min(opts.fit === 'cover' ? Math.max(kx, ky) : Math.min(kx, ky), maxScale);
      el.style.width = Math.floor(w * k) + 'px';
      el.style.height = Math.floor(h * k) + 'px';
    }
    fit();
    root.addEventListener('resize', fit);
    return api;
  }

  /**
   * Abre la cámara: la trasera en el celular, la webcam en la laptop. Devuelve un p5.MediaElement
   * (como createCapture) que se pasa a ar.detect(cam).
   *   opts.facing: 'environment' (trasera, por defecto) | 'user' (frontal)
   *
   * En el celular se pide la trasera de forma estricta (facingMode exact): con 'ideal' algunos
   * celulares abren igual la frontal. Si aun así llega la frontal, se busca la trasera por su nombre.
   */

    v.setAttribute('playsinline', ''); v.setAttribute('autoplay', ''); v.muted = true;
    v.style.display = 'none';

    if (!md || !md.getUserMedia) {

      return cam;
    }
    function size(c) { if (!mobile) { c.width = { ideal: 640 }; c.height = { ideal: 480 }; } return c; }
    var tries = (mobile ? [{ facingMode: { exact: facing } }] : []).concat([{ facingMode: { ideal: facing } }, {}]);

    function open(i) {
      if (i >= tries.length) return Promise.reject(new Error('nyar4p5: no se pudo abrir la cámara'));
      return md.getUserMedia({ video: size(tries[i]), audio: false }).catch(function (e) {
        if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) throw e; // permiso negado: no insistir
        return open(i + 1);

      var st = track.getSettings ? track.getSettings() : {};

      var label = (track.label || '').toLowerCase();
      var back = /back|rear|environment|trasera|posterior/.test(label);

      return md.enumerateDevices().then(function (list) {
        var want = facing === 'environment' ? /back|rear|environment|trasera|posterior/i : /front|user|frontal/i;
        var dev = list.filter(function (d) { return d.kind === 'videoinput' && want.test(d.label); })[0];
        if (!dev) return stream;
        stream.getTracks().forEach(function (t) { t.stop(); });
        return md.getUserMedia({ video: { deviceId: { exact: dev.deviceId } }, audio: false });

      v.srcObject = stream;

    }).catch(function (e) {
      console.error('nyar4p5: no se pudo abrir la cámara: ' + (e && e.message || e));
    });
    return cam;
  }

  // ======================================================================
  //  Conversor imagen -> .patt
  // ======================================================================

  /**
   * Convierte una imagen en el texto de un archivo .patt de ARToolKit (16×16, 4 orientaciones, BGR).
   *
   * @param {p5.Image|p5.Graphics|HTMLImageElement|HTMLCanvasElement|HTMLVideoElement} img
   * @param {object} [opts]
   *   edge:  'auto' (por defecto) | número (porcentaje de borde negro por lado, estilo NyARToolkit: 25)
   *          'auto' detecta si la imagen trae el marcador completo (con borde negro y margen blanco)
   *          o solo el dibujo interior. Con 0 se usa la imagen entera como dibujo interior.
   *   patternRatio: proporción del dibujo interior respecto del marcador (0.5 por defecto = borde 25%)
   * @returns {string} contenido del .patt
   */
  function makePattern(img, opts) {
    opts = opts || {};
    var el = sourceElement(img);
    if (!el) throw new Error('nyar4p5.makePattern: imagen no válida');
    var size = sourceSize(el), sw = size[0], sh = size[1];
    if (!sw || !sh) throw new Error('nyar4p5.makePattern: la imagen aún no ha cargado');

    var ratio = opts.patternRatio || 0.5;
    var crop = findPatternRegion(el, sw, sh, opts.edge == null ? 'auto' : opts.edge, ratio);
    makePattern.lastRegion = crop; // para depurar: {x, y, w, h, mode}

    // muestreo por promedio de área: primero a 64×64 con suavizado, luego bloques 4×4
    var K = 4, S = PATT_SIZE * K;
    var c = makeCanvas(S, S), ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, S, S);
    ctx.drawImage(el, crop.x, crop.y, crop.w, crop.h, 0, 0, S, S);
    var d = ctx.getImageData(0, 0, S, S).data;

    // grid[ch][y][x] con ch: 0=R 1=G 2=B
    var grid = [[], [], []];
    for (var ch = 0; ch < 3; ch++) {
      for (var y = 0; y < PATT_SIZE; y++) {
        var row = [];
        for (var x = 0; x < PATT_SIZE; x++) {
          var sum = 0, cnt = 0;
          for (var yy = 0; yy < K; yy++) for (var xx = 0; xx < K; xx++) {
            var o = ((y * K + yy) * S + (x * K + xx)) * 4;
            var a = d[o + 3] / 255; // transparente cuenta como blanco
            sum += d[o + ch] * a + 255 * (1 - a); cnt++;
          }
          row.push(Math.round(sum / cnt));
        }
        grid[ch].push(row);
      }
    }

    // diagnóstico: cuánto contraste hay y cuánto detalle sobrevive al reducir a 16×16
    var lum64 = [], lum16 = [], FS = 256; // "imagen completa" medida a 256×256
    var fc = makeCanvas(FS, FS), fctx = fc.getContext('2d', { willReadFrequently: true });
    fctx.fillStyle = '#fff'; fctx.fillRect(0, 0, FS, FS);
    fctx.drawImage(el, crop.x, crop.y, crop.w, crop.h, 0, 0, FS, FS);
    var fd = fctx.getImageData(0, 0, FS, FS).data;
    for (var i = 0; i < FS * FS; i++) lum64.push(fd[i * 4] * 0.299 + fd[i * 4 + 1] * 0.587 + fd[i * 4 + 2] * 0.114);
    for (var gy = 0; gy < PATT_SIZE; gy++) for (var gx = 0; gx < PATT_SIZE; gx++) {
      lum16.push(grid[0][gy][gx] * 0.299 + grid[1][gy][gx] * 0.587 + grid[2][gy][gx] * 0.114);
    }
    var std64 = stdev(lum64), std16 = stdev(lum16);

    // refuerzo de contraste: estira los tonos al rango completo (las imágenes suaves o muy oscuras
    // también funcionan; el marcador imprimible de makeMarkerImage aplica el mismo refuerzo)
    if (opts.normalize !== false) stretchGrid(grid, lum16);

    var patt = gridToPatt(grid);
    makePattern.lastInfo = analyzePattern(patt, std64, std16);
    return patt;
  }

  function stdev(a) {
    var m = 0, v = 0, i;
    for (i = 0; i < a.length; i++) m += a[i];
    m /= a.length;
    for (i = 0; i < a.length; i++) v += (a[i] - m) * (a[i] - m);
    return Math.sqrt(v / a.length);
  }

  function percentiles(a, lo, hi) {
    var b = a.slice().sort(function (x, y) { return x - y; });
    return [b[Math.floor(lo * (b.length - 1))], b[Math.floor(hi * (b.length - 1))]];
  }

  function stretchGrid(grid, lum) {
    var pr = percentiles(lum, 0.02, 0.98), lo = pr[0], hi = pr[1];
    if (hi - lo < 1) return;
    var k = 255 / (hi - lo);
    for (var ch = 0; ch < 3; ch++) for (var y = 0; y < PATT_SIZE; y++) for (var x = 0; x < PATT_SIZE; x++) {
      grid[ch][y][x] = Math.max(0, Math.min(255, Math.round((grid[ch][y][x] - lo) * k)));
    }
  }

  // correlación entre dos patrones (orientación 0 de a contra las 4 de b); 1 = idénticos
  function pattCorrelation(a, b) {
    var A = String(a).trim().split(/\s+/).map(Number), B = String(b).trim().split(/\s+/).map(Number);
    var n = PATT_SIZE * PATT_SIZE * 3, best = -1;
    var x = A.slice(0, n), mx = x.reduce(function (s, v) { return s + v; }, 0) / n;
    for (var k = 0; k < 4; k++) {
      var y = B.slice(k * n, (k + 1) * n);
      if (y.length < n) break;
      var my = y.reduce(function (s, v) { return s + v; }, 0) / n, sxy = 0, sxx = 0, syy = 0;
      for (var i = 0; i < n; i++) { var dx = x[i] - mx, dy = y[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
      var c = (sxx > 0 && syy > 0) ? sxy / Math.sqrt(sxx * syy) : 0;
      if (c > best) best = c;
    }
    return best;
  }

  /**
   * Evalúa si una imagen servirá como marcador. Devuelve {ok, warnings[], contrast, detail, symmetry}.
   *   - contraste muy bajo / demasiado detalle fino: la cámara verá casi un gris uniforme y no lo reconocerá
   *   - simetría: se detecta, pero el objeto puede aparecer girado (no hay un "arriba" claro)
   */
  function analyzePattern(patt, std64, std16) {
    var n = PATT_SIZE * PATT_SIZE * 3, A = String(patt).trim().split(/\s+/).map(Number);
    var rot = [A.slice(n, 2 * n), A.slice(2 * n, 3 * n), A.slice(3 * n, 4 * n)].map(function (r) { return r.join(' '); });
    var base = A.slice(0, n).join(' '), sym = -1;
    rot.forEach(function (r) { sym = Math.max(sym, pattCorrelation(base, r)); });
    var warnings = [], ok = true;
    if (std64 > 12 && std16 < std64 * 0.45) { ok = false; warnings.push('Tiene demasiado detalle fino: a la distancia de la cámara se verá como un gris uniforme. Usa formas más grandes.'); }
    else if (std16 < 4) { ok = false; warnings.push('La imagen es casi de un solo tono: la cámara no podrá distinguirla. Usa una imagen con formas claras.'); }
    else if (std64 < 25) { warnings.push('Tiene poco contraste: lo reforzamos automáticamente. Imprime el marcador que genera esta página, no la imagen original.'); }
    if (sym > 0.85) warnings.push('Es casi simétrica: se detectará, pero el objeto puede aparecer girado porque no hay un "arriba" claro. Agrega un detalle en una esquina.');
    return { ok: ok, warnings: warnings, contrast: Math.round(std64), detail: +(std16 / Math.max(1, std64)).toFixed(2), symmetry: +sym.toFixed(2) };
  }

  // rota 90° antihorario: dst(x,y) = src(N-1-y, x)  (igual que el generador de AR.js)
  function rotCCW(m) {
    var N = m.length, out = [];
    for (var y = 0; y < N; y++) {
      var row = [];
      for (var x = 0; x < N; x++) row.push(m[x][N - 1 - y]);
      out.push(row);
    }
    return out;
  }

  function pad3(v) { var s = String(v); return s.length >= 3 ? s : ('   ' + s).slice(-3); }

  function gridToPatt(grid) {
    var blocks = [], g = grid;
    for (var k = 0; k < 4; k++) {
      var lines = [];
      // orden de canales en .patt: B, G, R
      [2, 1, 0].forEach(function (ch) {
        g[ch].forEach(function (row) { lines.push(row.map(pad3).join(' ')); });
      });
      blocks.push(lines.join('\n'));
      g = [rotCCW(g[0]), rotCCW(g[1]), rotCCW(g[2])];
    }
    return blocks.join('\n\n') + '\n';
  }

  /** Lee un .patt (texto) y devuelve la orientación 0 como grid[ch][y][x] (ch 0=R 1=G 2=B). */
  function parsePatt(text) {
    var nums = String(text).trim().split(/\s+/).map(Number);
    var N = PATT_SIZE, per = N * N * 3;
    if (nums.length < per) throw new Error('nyar4p5: .patt incompleto');
    var grid = [[], [], []];
    [2, 1, 0].forEach(function (ch, ci) {
      for (var y = 0; y < N; y++) grid[ch].push(nums.slice(ci * N * N + y * N, ci * N * N + (y + 1) * N));
    });
    return grid;
  }

  // Busca la zona del dibujo interior dentro de la imagen.
  function findPatternRegion(el, sw, sh, edge, ratio) {
    if (typeof edge === 'number') {
      var e = Math.max(0, Math.min(49, edge)) / 100;
      return { x: sw * e, y: sh * e, w: sw * (1 - 2 * e), h: sh * (1 - 2 * e), mode: 'edge ' + edge + '%' };
    }
    // 'auto': trabajar sobre una copia reducida
    var M = 256, sc = Math.min(1, M / Math.max(sw, sh));
    var w = Math.max(1, Math.round(sw * sc)), h = Math.max(1, Math.round(sh * sc));
    var c = makeCanvas(w, h), ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(el, 0, 0, w, h);
    var d = ctx.getImageData(0, 0, w, h).data;
    var dark = new Uint8Array(w * h);
    var x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var o = (y * w + x) * 4;
      if ((d[o] * 0.299 + d[o + 1] * 0.587 + d[o + 2] * 0.114) < 96) {
        dark[y * w + x] = 1;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;

    if (v) this._drawQuad2D(v, col || this.p.color(0, 255, 0), 4, true);
  };

  /** Todos los cuadrados detectados: registrados en verde, NyId sin registrar en celeste, desconocidos en amarillo. */
  MM.drawSquares = function () {
    var P = this.p;
    for (var i = 0; i < this.squares.length; i++) {
      var s = this.squares[i];
      var col = s.marker >= 0 ? P.color(0, 255, 0) : (s.nyid >= 0 ? P.color(0, 200, 255) : P.color(255, 210, 0));
      this._drawQuad2D(s.marker >= 0 ? this.markers[s.marker].vertex : s.vertex, col, 3, s.marker >= 0);
    }
  };

  /** Dentro de begin/endTransform: cuadrado del marcador (magenta) y ejes X/Y/Z. */
  MM.drawMarkerFrame = function (id) {
    var P = this.p, h = this.markers[id].width / 2, L = h;
    this._flatLines(function () {
      P.push();
      P.noFill();
      P.strokeWeight(2);
      P.stroke(255, 0, 255);
      P.beginShape();
      P.vertex(-h, -h, 0); P.vertex(h, -h, 0); P.vertex(h, h, 0); P.vertex(-h, h, 0);
      P.endShape(P.CLOSE);
      P.strokeWeight(5);
      P.stroke(255, 40, 40); P.line(0, 0, 0, L, 0, 0);  // X rojo
      P.stroke(40, 220, 40); P.line(0, 0, 0, 0, L, 0);  // Y verde
      P.stroke(60, 120, 255); P.line(0, 0, 0, 0, 0, L); // Z azul
      P.pop();
    });
  };

  root.NyAR = {
    MultiMarker: MultiMarker,
    makePattern: makePattern,
    comparePatterns: pattCorrelation,
    PATT: BUILTIN_PATT,
    makeNyIdMarkerImage: makeNyIdMarkerImage,
    nyIdCells: nyIdCells,
    NyIdReader: NyIdReader,
    GsRaster: GsRaster,
    makeMarkerImage: makeMarkerImage,
    saveMarkerImage: saveMarkerImage,
    pattToImage: pattToImage,
    parsePatt: parsePatt,
    savePattern: savePattern,
    THRESHOLD_MODES: THRESHOLD_MODES,
    createCamera: createCamera,
    createARCanvas: createARCanvas,
    isMobile: isMobile,
    size: arSize,
    version: VERSION

  <body>
    <main></main>
    <script>
// nyar4p5 · 05 nyId — marcadores de ID numérico de nyatla (NyId)
//
// NyId 0 → cubo · NyId 1 → esfera · cualquier otro NyId de 2 a 511 → su número flotando encima.
// Los NyId se leen con el decodificador de NyARToolkit portado a JavaScript:
// no hay que entrenar ni cargar archivos, basta con imprimirlos.
// Panel lateral: genera el PNG imprimible de cualquier ID.
// Teclas: D diagnóstico

let cam, ar, showDiag = true;
let ANY; // índice del marcador de rango
const tags = {};

function setup() {
  crearInterfaz(); // paneles y estilos (al final del archivo)
  NyAR.createARCanvas(this, { parent: 'stage', maxScale: 1 }); // vertical en el celular
  cam = NyAR.createCamera(this);   // cámara trasera en el celular, webcam en la laptop

  ar = new NyAR.MultiMarker(this, width, height, { lostDelay: 4 });
  ar.addNyIdMarker(0, 80);             // índice 0: solo el NyId 0, de 80 mm (borde negro incluido)
  ar.addNyIdMarker(1, 80);             // índice 1: solo el NyId 1
  ANY = ar.addNyIdMarker(2, 511, 80);  // índice 2: cualquier NyId de 2 a 511

  setupPanel();
}

function draw() {
  background(12);
  if (ar.error) return status('error', 'Error: ' + ar.error.message);
  if (!ar.ready) return status('wait', 'Cargando motor ARToolKit…');
  const hasFrame = ar.detect(cam);
  ar.applyCamera();
  ar.drawBackground();
  if (!hasFrame) return status('wait', 'Esperando la cámara…');

  if (showDiag) ar.drawSquares(); // verde = registrado · celeste = NyId fuera de los rangos · amarillo = otro cuadrado

  if (ar.isExist(0)) {
    ar.beginTransform(0);
    push(); translate(0, 0, 20); normalMaterial(); stroke(255); box(40); pop();
    ar.endTransform();
  }
  if (ar.isExist(1)) {
    ar.beginTransform(1);
    push(); translate(0, 0, 25); noStroke(); ambientLight(90); directionalLight(255, 255, 255, 0.2, 0.4, -1);
    ambientMaterial(255, 140, 0); sphere(22); pop();
    ar.endTransform();
  }
  if (ar.isExist(ANY)) {
    ar.beginSurface(ANY); // el papel como lienzo 2D
    push(); translate(0, 0, 1); noStroke(); fill(0, 200, 255, 150); rect(-28, -28, 56, 56); // placa sobre el papel
    fill(255, 210, 0); triangle(0, -40, -8, -30, 8, -30); pop();                              // flecha hacia "arriba" del NyId
    ar.endTransform();
  }
  updateTags();
  status(ar.getExistMarkers().length ? 'ok' : 'search', hudText());
}

// etiqueta HTML con el número sobre cada marcador visible
function updateTags() {
  for (let i = 0; i < ar.getMarkerCount(); i++) {
    if (!tags[i]) {
      tags[i] = document.createElement('div');
      tags[i].className = 'tag';
      document.getElementById('stage').appendChild(tags[i]);
    }
    const s = ar.isExist(i) ? ar.marker2Screen(i, 0, 0, 55) : null;
    tags[i].style.display = s ? 'block' : 'none';
    if (s) {
      tags[i].textContent = 'NyId ' + ar.getNyId(i);
      const k = drawingContext.canvas.clientWidth / width; // el lienzo puede verse escalado en pantalla
      tags[i].style.transform = `translate(${s[0] * k}px, ${s[1] * k}px) translate(-50%, -100%)`;
    }
  }
}

function hudText() {
  const vis = ar.getExistMarkers().map(i => ar.getNyId(i));
  const others = ar.getSquares().filter(s => s.nyid >= 0 && s.marker < 0).map(s => s.nyid);
  return (vis.length ? 'NyId visibles: ' + vis.join(', ') : 'Muestra un NyId a la cámara (imprime uno desde el panel)') +
    (others.length ? ` · fuera de rango: ${others.join(', ')}` : '');
}

function status(kind, msg) {
  document.getElementById('hud').innerHTML = `<div class="row"><span class="dot ${kind}"></span>${msg}</div>
    <div class="keys">D diagnóstico</div>`;
}

function keyPressed() {
  if (key === 'd' || key === 'D') showDiag = !showDiag;
}

// ---------- generador de marcadores ----------

const preview = document.createElement('canvas'); // 1024×1024 para imprimir
preview.width = preview.height = 1024;
function setupPanel() {
  const input = document.getElementById('nyid');
  const make = () => {
    const id = Number(input.value);
    try {
      NyAR.makeNyIdMarkerImage(id, { canvas: preview });
      const c = document.getElementById('pv');
      c.getContext('2d').drawImage(preview, 0, 0, c.width, c.height);
      document.getElementById('info').textContent =
        `NyId ${id} · modelo ${id <= 511 ? 2 : 3} (${id <= 511 ? '5×5' : '7×7'} celdas interiores)`;
    } catch (e) {
      document.getElementById('info').textContent = e.message;
    }
  };
  input.addEventListener('input', make);
  document.getElementById('dl').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = preview.toDataURL('image/png');
    a.download = `nyid-${input.value}.png`;
    a.click();
  });
  make();
}

// ---------- interfaz ----------
// Estilos y paneles se crean desde aquí: así el ejemplo funciona con el index.html que trae el
// p5.js Web Editor (y al exportarlo o subirlo a tu servidor) sin tocar nada más.
function crearInterfaz() {
  document.head.insertAdjacentHTML('beforeend', `<style>
    body { margin: 0; background: #111; color: #eee; font: 14px system-ui, sans-serif; }
    #stage { position: relative; display: inline-block; line-height: 0; }
    #hud { padding: 8px 12px; }
    .row { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; flex: none; }
    .dot.ok { background: #2ecc71; } .dot.search { background: #f1c40f; } .dot.error { background: #e74c3c; }
    .grid { display: grid; grid-template-columns: auto auto; gap: 2px 16px; margin-top: 6px; width: max-content; }
    .keys { opacity: .7; margin-top: 6px; }
    .tag { position: absolute; left: 0; top: 0; line-height: 1; padding: 4px 8px; border-radius: 6px;
    background: rgba(0,0,0,.75); color: #fff; font-weight: 700; pointer-events: none; white-space: nowrap; }
    main { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
    aside { padding: 8px 12px; width: 280px; display: grid; gap: 10px; }
    aside h2 { font-size: 15px; margin: 6px 0 0; }
    #pv { width: 256px; height: 256px; background: #fff; display: block; }
    button, input { font: inherit; }
    button { padding: 6px 10px; border-radius: 6px; border: 1px solid #555; background: #222; color: #eee; cursor: pointer; }
    #info { font-size: 12px; opacity: .8; }

  </style>`);
  document.body.insertAdjacentHTML('afterbegin', `
    <main>
      <div>
        <div id="stage"></div>
        <div id="hud"></div>
      </div>
      <aside>
        <h2>Generar un NyId para imprimir</h2>
        <label>ID: <input id="nyid" type="number" value="0" min="0" max="33554431" style="width:9em"></label>
        <canvas id="pv" width="512" height="512"></canvas>
        <div id="info"></div>
        <div><button id="dl">Descargar PNG</button></div>
        <div id="info2" style="font-size:12px;opacity:.7">0–511: modelo 2 (el clásico). Desde 512: modelo 3.
          Mide el ancho en mm incluyendo el borde negro.</div>
      </aside>
    </main>
    
  `);
}

</script>
